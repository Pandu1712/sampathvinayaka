    <!-- Google Search Console & Google Analytics Integration -->
    <script>
      (function() {
        const gscId = "%VITE_GOOGLE_SITE_VERIFICATION%";
        if (gscId && gscId !== "%" + "VITE_GOOGLE_SITE_VERIFICATION%") {
          const meta = document.createElement("meta");
          meta.name = "google-site-verification";
          meta.content = gscId;
          document.head.appendChild(meta);
        }
        
        const gaId = "%VITE_GOOGLE_ANALYTICS_ID%";
        if (gaId && gaId !== "%" + "VITE_GOOGLE_ANALYTICS_ID%") {
          const script = document.createElement("script");
          script.async = true;
          script.src = "https://www.googletagmanager.com/gtag/js?id=" + gaId;
          document.head.appendChild(script);

          window.dataLayer = window.dataLayer || [];
          window.gtag = function() { window.dataLayer.push(arguments); };
          gtag('js', new Date());
          gtag('config', gaId);
        }
      })();
    </script>
