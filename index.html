    <style>
      #launch-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: all 1.8s cubic-bezier(0.4, 0, 0.2, 1);
        font-family: 'Outfit', sans-serif;
        background: radial-gradient(circle at center, rgba(161, 98, 7, 0.25) 0%, rgba(28, 4, 4, 0.99) 60%, rgb(10, 2, 2) 100%),
                    url('https://www.transparenttextures.com/patterns/natural-paper.png');
        background-color: #0c0202;
      }
      #launch-overlay.fade-out {
        opacity: 0;
        transform: scale(0.96) translateY(-12px);
        pointer-events: none;
      }
      
      /* Inset shadow vignette */
      .launch-vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 4;
        box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.9);
      }

      /* Ornate Golden Frame */
      .launch-frame {
        position: absolute;
        inset: 16px;
        border: 1px solid rgba(217, 119, 6, 0.25);
        pointer-events: none;
        z-index: 5;
      }
      @media (min-width: 640px) {
        .launch-frame {
          inset: 24px;
        }
      }
      .launch-corner {
        position: absolute;
        width: 24px;
        height: 24px;
        border-color: rgba(217, 119, 6, 0.7);
        border-style: solid;
      }
      .launch-corner::after {
        content: '';
        position: absolute;
        width: 5px;
        height: 5px;
        background: #f59e0b;
        border-radius: 50%;
        box-shadow: 0 0 8px #f59e0b;
      }
      .launch-corner.tl { top: 0; left: 0; border-width: 2px 0 0 2px; }
      .launch-corner.tl::after { top: 3px; left: 3px; }
      .launch-corner.tr { top: 0; right: 0; border-width: 2px 2px 0 0; }
      .launch-corner.tr::after { top: 3px; right: 3px; }
      .launch-corner.bl { bottom: 0; left: 0; border-width: 0 0 2px 2px; }
      .launch-corner.bl::after { bottom: 3px; left: 3px; }
      .launch-corner.br { bottom: 0; right: 0; border-width: 0 2px 2px 0; }
      .launch-corner.br::after { bottom: 3px; right: 3px; }

      /* Background Image Overlay */
      .launch-bg-image {
        position: absolute;
        inset: 0;
        opacity: 0.035;
        pointer-events: none;
        mix-blend-mode: overlay;
        background-image: url('https://res.cloudinary.com/ddmzgotdd/image/upload/v1779087511/DSC_2151_k72wsc.jpg');
        background-size: cover;
        background-position: center;
      }

      /* Ornate Spinning Mandala */
      .launch-mandala {
        position: absolute;
        width: 320px;
        height: 320px;
        color: rgba(245, 158, 11, 0.25);
        animation: spin-mandala 60s linear infinite;
        pointer-events: none;
        z-index: 2;
      }
      @media (min-width: 640px) {
        .launch-mandala {
          width: 450px;
          height: 450px;
        }
      }
      @keyframes spin-mandala {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Glowing Aura & Floating Logo */
      .launch-aura {
        position: absolute;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: rgba(245, 158, 11, 0.15);
        filter: blur(32px);
        animation: pulse-aura 4s ease-in-out infinite;
        z-index: 1;
      }
      @media (min-width: 640px) {
        .launch-aura {
          width: 210px;
          height: 210px;
        }
      }
      @keyframes pulse-aura {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.3); opacity: 1; }

      .launch-flower {
        position: absolute;
        pointer-events: none;
        z-index: 2;
        opacity: 0;

        filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.2));

      @keyframes fall-flower {
        0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0; }
        10% { opacity: 0.85; }
        90% { opacity: 0.85; }

      /* Animations */
      @keyframes fade-rise {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }

      /* Bottom Decorative Border */
      .launch-bottom-border {
        position: absolute;

    <!-- Script to dynamically build SVGs and handle click event with bell audio synthesis -->
    <script>
      (function() {
        const overlay = document.getElementById("launch-overlay");
        const btn = document.getElementById("launch-btn");
        if (!overlay || !btn) return;

        // 1. Build Mandala SVG content dynamically to keep file size down
        const svg = document.getElementById("launch-mandala-svg");
        if (svg) {
          svg.innerHTML = `
            <circle cx="50" cy="50" r="48" fill="none" stroke="currentColor" stroke-width="0.5" stroke-dasharray="3 3"></circle>
            <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="0.2"></circle>
            <circle cx="50" cy="50" r="41" fill="none" stroke="currentColor" stroke-width="0.8" stroke-dasharray="1 4"></circle>
            <circle cx="50" cy="50" r="22" fill="none" stroke="currentColor" stroke-width="0.4"></circle>
          `;
          
          // Spokes (24 lines)
          for (let i = 0; i < 24; i++) {
            const angle = (i * 15 * Math.PI) / 180;
            const x2 = 50 + 41 * Math.cos(angle);
            const y2 = 50 + 41 * Math.sin(angle);
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", "50");
            line.setAttribute("y1", "50");
            line.setAttribute("x2", x2.toFixed(3));
            line.setAttribute("y2", y2.toFixed(3));
            line.setAttribute("stroke", "currentColor");
            line.setAttribute("stroke-width", "0.15");
            line.setAttribute("stroke-dasharray", "2 6");
            svg.appendChild(line);
          }
          
          // Petals (12 paths)
          for (let i = 0; i < 12; i++) {
            const angle = (i * 30 * Math.PI) / 180;
            const x1 = 50 + 22 * Math.cos(angle - 0.15);
            const y1 = 50 + 22 * Math.sin(angle - 0.15);
            const x2 = 50 + 38 * Math.cos(angle);
            const y2 = 50 + 38 * Math.sin(angle);
            const x3 = 50 + 22 * Math.cos(angle + 0.15);
            const y3 = 50 + 22 * Math.sin(angle + 0.15);
            
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", `M 50 50 Q ${x1.toFixed(3)} ${y1.toFixed(3)} ${x2.toFixed(3)} ${y2.toFixed(3)} Q ${x3.toFixed(3)} ${y3.toFixed(3)} 50 50`);
            path.setAttribute("fill", "none");
            path.setAttribute("stroke", "currentColor");
            path.setAttribute("stroke-width", "0.4");
            svg.appendChild(path);
          }
        }

        // 2. Build bottom border petals
        const borderContainer = document.getElementById("launch-bottom-border-container");
        if (borderContainer) {
          const width = window.innerWidth;
          const numPetals = Math.ceil(width / 48) + 2;
          for (let i = 0; i < numPetals; i++) {
            const petal = document.createElement("div");
            petal.className = "launch-bottom-petal";
            borderContainer.appendChild(petal);
          }
        }

        // 3. Generate Floating Particles in the background
        for (let i = 0; i < 15; i++) {
          const p = document.createElement("div");
          p.className = "launch-particle";
          const size = Math.random() * 5 + 3; // 3px to 8px
          p.style.width = size + "px";
          p.style.height = size + "px";
          p.style.left = (Math.random() * 90 + 5) + "%";
          p.style.bottom = (Math.random() * 20) + "%";
          p.style.animationDelay = (Math.random() * 8) + "s";
          p.style.animationDuration = (Math.random() * 6 + 6) + "s"; // 6s to 12s
          overlay.appendChild(p);
        }

        // Generate Falling Flowers (Pushpa Vrishti)
        const flowerTemplates = [
          // Marigold SVG
          `<svg viewBox="0 0 24 24" fill="#f59e0b" style="width: 100%; height: 100%;"><circle cx="12" cy="12" r="3" fill="#d97706"></circle><path d="M12 2C9.5 2 9 6 12 8C15 6 14.5 2 12 2Z"></path><path d="M12 22C14.5 22 15 18 12 16C9 18 9.5 22 12 22Z"></path><path d="M2 12C2 14.5 6 15 8 12C6 9 2 9.5 2 12Z"></path><path d="M22 12C22 9.5 18 9 16 12C18 15 22 14.5 22 12Z"></path><path d="M5 5C5 7.5 9 8 8 5C7 2 5 2.5 5 5Z"></path><path d="M19 19C19 16.5 15 16 16 19C17 22 19 21.5 19 19Z"></path><path d="M19 5C16.5 5 16 9 19 8C22 7 21.5 5 19 5Z"></path><path d="M5 19C7.5 19 8 15 5 16C2 17 2.5 19 5 19Z"></path></svg>`,
          // Rose Petal SVG
          `<svg viewBox="0 0 24 24" fill="#be123c" style="width: 100%; height: 100%;"><path d="M12 3 C 6 3, 3 9, 3 14 C 3 19, 9 21, 12 21 C 15 21, 21 19, 21 14 C 21 9, 18 3, 12 3 Z"></path></svg>`,
          // Yellow Jasmine SVG
          `<svg viewBox="0 0 24 24" fill="#fef08a" style="width: 100%; height: 100%;"><circle cx="12" cy="12" r="3" fill="#ca8a04"></circle><path d="M12 2C10.5 2 10 5 12 7C14 5 13.5 2 12 2Z"></path><path d="M12 22C13.5 22 14 19 12 17C10 19 10.5 22 12 22Z"></path><path d="M2 12C2 13.5 5 14 7 12C5 10 2 10.5 2 12Z"></path><path d="M22 12C22 10.5 19 10 17 12C19 14 22 13.5 22 12Z"></path><path d="M5 5C5 6.5 8 7 7 5C6 3 5 3.5 5 5Z"></path><path d="M19 19C19 17.5 16 17 17 19C18 21 19 20.5 19 19Z"></path><path d="M19 5C17.5 5 17 8 19 7C21 6 20.5 5 19 5Z"></path><path d="M5 19C6.5 19 7 16 5 17C3 18 3.5 19 5 19Z"></path></svg>`
        ];

        for (let i = 0; i < 30; i++) {
          const f = document.createElement("div");
          f.className = "launch-flower";
          const templateIdx = Math.floor(Math.random() * flowerTemplates.length);
          f.innerHTML = flowerTemplates[templateIdx];
          
          const size = Math.random() * 12 + 10; // 10px to 22px
          f.style.width = size + "px";
          f.style.height = size + "px";
          f.style.left = (Math.random() * 95) + "%";
          f.style.top = "-30px";
          f.style.animationDelay = (Math.random() * 10) + "s";
          f.style.animationDuration = (Math.random() * 7 + 7) + "s"; // 7s to 14s
          overlay.appendChild(f);
        }

        // 4. Audio synthesis for the temple bell
        const playBell = () => {
          try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            const now = ctx.currentTime;
            
            // Resonance values for an Indian temple bell
            const fund = 180; 
            const partials = [
              { ratio: 1.0, gain: 0.6, decay: 3.5 },
              { ratio: 2.0, gain: 0.8, decay: 2.5 },
              { ratio: 2.4, gain: 0.7, decay: 2.0 },
              { ratio: 3.0, gain: 0.5, decay: 1.5 },
              { ratio: 4.0, gain: 0.4, decay: 1.2 },
              { ratio: 5.3, gain: 0.3, decay: 0.8 },
              { ratio: 6.7, gain: 0.2, decay: 0.5 }
            ];

            const masterGain = ctx.createGain();
            masterGain.gain.setValueAtTime(0, now);
            masterGain.gain.linearRampToValueAtTime(0.9, now + 0.01);
            masterGain.gain.exponentialRampToValueAtTime(0.001, now + 3.8);
            masterGain.connect(ctx.destination);

            partials.forEach(p => {
              const osc = ctx.createOscillator();
              const gainNode = ctx.createGain();
              osc.type = "sine";
              osc.frequency.setValueAtTime(fund * p.ratio, now);
              gainNode.gain.setValueAtTime(p.gain, now);
              gainNode.gain.exponentialRampToValueAtTime(0.0001, now + p.decay);
              osc.connect(gainNode);
              gainNode.connect(masterGain);
              osc.start(now);
              osc.stop(now + p.decay + 0.5);
            });
          } catch (e) {
            console.warn("Audio synthesis error:", e);
          }
        };

        // 5. Flower Confetti Blast (Pushpa Confetti)
        const blastFlowers = () => {
          const rect = btn.getBoundingClientRect();
          const startX = rect.left + rect.width / 2;
          const startY = rect.top + rect.height / 2;
          const particles = [];
          
          // Spawn 80 flower particles
          for (let i = 0; i < 80; i++) {
            const el = document.createElement("div");
            el.className = "launch-flower"; // reuse flower styling
            
            const templateIdx = Math.floor(Math.random() * flowerTemplates.length);
            el.innerHTML = flowerTemplates[templateIdx];
            
            const size = Math.random() * 12 + 12; // 12px to 24px
            el.style.width = size + "px";
            el.style.height = size + "px";
            el.style.position = "absolute";
            el.style.left = startX + "px";
            el.style.top = startY + "px";
            el.style.zIndex = "999";
            el.style.pointerEvents = "none";
            el.style.transformOrigin = "center";
            overlay.appendChild(el);
            
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 15 + 5; // outward velocity
            
            particles.push({
              element: el,
              x: startX,
              y: startY,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed - (Math.random() * 6 + 3), // upward push
              rotation: Math.random() * 360,
              vrot: Math.random() * 12 - 6,
              opacity: 1
            });
          }
          
          // Physics Update Loop
          const update = () => {
            let active = false;
            particles.forEach(p => {
              p.vy += 0.25; // gravity
              p.vx *= 0.98; // air resistance
              p.vy *= 0.98;
              
              p.x += p.vx;
              p.y += p.vy;
              p.rotation += p.vrot;
              
              p.element.style.left = p.x + "px";
              p.element.style.top = p.y + "px";
              p.element.style.transform = `translate(-50%, -50%) rotate(${p.rotation}deg)`;
              
              p.opacity -= 0.007; // fade out
              p.element.style.opacity = Math.max(0, p.opacity);
              
              if (p.opacity > 0) active = true;
            });
            
            if (active) requestAnimationFrame(update);
          };
          requestAnimationFrame(update);
        };

        // 6. Click Handler
        btn.addEventListener("click", function() {
          // Play synthesized temple bell sound
          playBell();
          
          // Trigger flower confetti blast
          blastFlowers();
          
          // Visual expansion of the aura (sound wave ripple)
          const aura = document.querySelector(".launch-aura");
          if (aura) {
            aura.style.transition = "all 0.8s ease-out";
            aura.style.transform = "scale(2.5)";
            aura.style.opacity = "0";
            aura.style.filter = "blur(50px)";
          }

          // Haptic feedback (bell strike vibration on mobile)
          if (navigator.vibrate) {
            navigator.vibrate(100);
          }

          // Trigger CSS fadeout transition
          overlay.classList.add("fade-out");
          
          // Clean up DOM after transition (1.75 seconds to show full flower explosion)
          setTimeout(function() {
            overlay.style.display = "none";
            overlay.remove();
          }, 1750);
        });
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
